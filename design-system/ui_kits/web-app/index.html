<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origine · Web app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>body{margin:0}.leaflet-container{font-family:var(--font-sans);background:var(--vellum)}.leaflet-tooltip{font:500 13px/1.2 var(--font-sans);color:var(--paper);background:var(--ink);border:0;border-radius:var(--radius-sm);box-shadow:none;padding:6px 9px}.leaflet-tooltip-top:before{border-top-color:var(--ink)}.leaflet-bar a{color:var(--ink);background:var(--card)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="TreeScreen.jsx"></script>
<script type="text/babel" src="PersonScreen.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel" src="AuthScreens.jsx"></script>
<script type="text/babel" src="EditScreens.jsx"></script>
<script type="text/babel">
const TITLES = { tree: 'Family tree', people: 'People', map: 'Map', stories: 'Stories', activity: 'Activity', photo: 'Photo' };
const SHELLESS = ['signin', 'onboarding'];
function App() {
  const ls = (k, d) => localStorage.getItem(k) || d;
  const [route, setRoute] = React.useState(ls('origine-route-v2', 'signin'));
  const [pid, setPid] = React.useState(ls('origine-pid', 'm'));
  const [photo, setPhoto] = React.useState(ls('origine-photo', 'ph1'));
  const [prev, setPrev] = React.useState('tree');
  const [toast, setToast] = React.useState(null);
  React.useEffect(() => { localStorage.setItem('origine-route-v2', route); localStorage.setItem('origine-pid', pid); localStorage.setItem('origine-photo', photo); }, [route, pid, photo]);
  const top = () => { const m = document.querySelector('main'); if (m) m.scrollTop = 0; };
  const go = r => { setPrev(route); setRoute(r); top(); };
  const notify = t => { setToast({ ...t, onClose: () => setToast(null), onAction: t.onAction ? () => { t.onAction(); setToast(null); } : undefined }); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToast(null), 5000); };
  const open = id => { setPid(id); go('person'); };
  const openPhoto = id => { setPhoto(id); go('photo'); };
  if (route === 'signin') return <SignInScreen onSignedIn={() => setRoute('onboarding')} />;
  if (route === 'onboarding') return <OnboardingScreen onDone={r => setRoute(r)} />;
  const P = window.ORIGINE_DATA.people;
  const screen = {
    tree: <TreeScreen rootId="m" onOpen={open} notify={notify} />,
    person: <PersonScreen key={pid} id={pid} onOpen={open} onEdit={() => go('edit')} onPhoto={openPhoto} />,
    edit: <EditPersonScreen key={pid} id={pid} onDone={() => setRoute('person')} notify={notify} />,
    photo: <PhotoScreen key={photo} photoId={photo} onOpen={open} notify={notify} />,
    people: <PeopleScreen onOpen={open} />,
    map: <MapScreen />,
    stories: <StoriesScreen onPhoto={openPhoto} />,
    activity: <ActivityScreen notify={notify} onPhoto={openPhoto} onSignOut={() => setRoute('signin')} />,
  }[route] || null;
  const back = ['person', 'edit', 'photo'].includes(route);
  const title = route === 'person' ? P[pid]?.name : route === 'edit' ? 'Edit person' : TITLES[route];
  return <AppShell route={route} onRoute={r => { setRoute(r); top(); }} title={title} back={back}
    onBack={() => setRoute(route === 'edit' ? 'person' : (prev === route ? 'tree' : prev))} toast={toast} onSignOut={() => setRoute('signin')}>{screen}</AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
