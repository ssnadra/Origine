<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:grid;gap:16px}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch, Stepper } = window.OrigineDesignSystem_f2a82e;
const { useState } = React;
function Demo(){
const [c,setC]=useState(true);const [n,setN]=useState(2);const [r,setR]=useState('family');const [s,setS]=useState(true);
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
<div className="col"><Input label="Full name" placeholder="As it appears on records" defaultValue="Thomas Hale"/><Input label="Birth place" icon="map-pin" placeholder="Town, country" hint="Start typing to search places"/><Input label="Birth year" defaultValue="18900" error="That doesn't look like a year"/><Stepper label="Degrees" value={n} min={1} max={6} onChange={setN}/></div>
<div className="col" style={{gap:4}}><Select label="Relationship to Margaret" options={['Father','Mother','Child','Spouse','Sibling']} value="Father" onChange={()=>{}}/>
<Checkbox label="Show living people" description="Only family members can see them" checked={c} onChange={setC}/>
<Radio name="p" value="family" label="Family only" checked={r==='family'} onChange={setR}/><Radio name="p" value="me" label="Just me" checked={r==='me'} onChange={setR}/>
<Switch label="Email me about new photos" checked={s} onChange={setS}/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
