<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r" style="align-items:center;gap:20px"><div style="height:48px;padding:0 20px;display:flex;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--radius-md);font-weight:500;outline:1px dashed var(--aubergine);outline-offset:4px">Add a relative</div><div style="width:48px;height:48px;border:1px dashed var(--aubergine);border-radius:var(--radius-md);display:grid;place-items:center" class="mono">48</div><span class="mono">--tap-min: 48px · --control-h-sm: 36px (desktop dense only)</span></div></body></html>
