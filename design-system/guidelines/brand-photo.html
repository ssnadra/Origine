<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r" style="gap:16px;align-items:flex-start"><figure style="margin:0;display:grid;gap:6px;width:90px"><img src="../assets/sample-photos/125_0987.jpg" style="width:100%;height:120px;object-fit:cover;border-radius:var(--radius-sm);display:block"><figcaption style="font-size:12px;color:var(--ink-3)">Snow day · 21 March 2008</figcaption></figure><figure style="margin:0;display:grid;gap:6px;width:160px"><img src="../assets/sample-photos/125_0978.jpg" style="width:100%;height:120px;object-fit:cover;border-radius:var(--radius-sm);display:block"><figcaption style="font-size:12px;color:var(--ink-3)">Backyard, 2008</figcaption></figure><figure style="margin:0;display:grid;gap:6px;width:90px"><img src="../assets/sample-photos/125_0977.jpg" style="width:100%;height:120px;object-fit:cover;border-radius:var(--radius-sm);display:block"><figcaption style="font-size:12px;color:var(--ink-3)">The snowwoman</figcaption></figure><figure style="margin:0;display:grid;gap:6px"><div style="width:96px;height:120px;background:repeating-linear-gradient(135deg,var(--placeholder-stripe-a) 0 10px,var(--placeholder-stripe-b) 10px 20px);border-radius:var(--radius-sm)"></div><figcaption style="font-size:12px;color:var(--ink-3)">Placeholder</figcaption></figure></div></body></html>
