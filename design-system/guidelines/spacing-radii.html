<!-- @dsCard group="Spacing" viewport="700x140" name="Corner radii" subtitle="Small and restrained; pills only for chips and avatars" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r"><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:72px;height:56px;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius-xs)"></i><span class="mono">xs</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:72px;height:56px;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius-sm)"></i><span class="mono">sm</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:72px;height:56px;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius-md)"></i><span class="mono">md</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:72px;height:56px;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius-lg)"></i><span class="mono">lg</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:72px;height:56px;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius-xl)"></i><span class="mono">xl</span></div><div style="display:grid;gap:6px;justify-items:center"><i style="display:block;width:72px;height:56px;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius-full)"></i><span class="mono">full</span></div></div></body></html>
