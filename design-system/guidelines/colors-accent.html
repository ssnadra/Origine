<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r"><div class="sw"><i style="background:var(--aubergine)"></i><b>Aubergine</b>--aubergine</div><div class="sw"><i style="background:var(--aubergine-dark)"></i><b>Aubergine dark</b>--aubergine-dark</div><div class="sw"><i style="background:var(--aubergine-tint)"></i><b>Aubergine tint</b>--aubergine-tint</div></div></body></html>
