<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:grid;gap:6px"><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-1</span><i style="display:block;height:8px;width:var(--space-1);background:var(--aubergine)"></i></div><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-2</span><i style="display:block;height:8px;width:var(--space-2);background:var(--aubergine)"></i></div><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-3</span><i style="display:block;height:8px;width:var(--space-3);background:var(--aubergine)"></i></div><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-4</span><i style="display:block;height:8px;width:var(--space-4);background:var(--aubergine)"></i></div><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-5</span><i style="display:block;height:8px;width:var(--space-5);background:var(--aubergine)"></i></div><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-6</span><i style="display:block;height:8px;width:var(--space-6);background:var(--aubergine)"></i></div><div style="display:flex;gap:12px;align-items:center"><span class="mono" style="width:80px">--space-8</span><i style="display:block;height:8px;width:var(--space
