<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:grid;gap:8px" class="mono"><div>--dur-1 120ms · hover, press</div><div>--dur-2 180ms · menus, tooltips, tabs</div><div>--dur-3 280ms · sheets, dialogs, tree re-centre</div><div>--ease-out cubic-bezier(.2,.7,.2,1)</div></div></body></html>
