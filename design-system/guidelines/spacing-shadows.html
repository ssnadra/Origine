<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Hairlines first; shadows only for floating layers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r" style="gap:24px"><div style="display:grid;gap:8px;justify-items:center"><i style="display:block;width:120px;height:72px;background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--rule)"></i><span class="mono">Hairline</span></div><div style="display:grid;gap:8px;justify-items:center"><i style="display:block;width:120px;height:72px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)"></i><span class="mono">shadow-1</span></div><div style="display:grid;gap:8px;justify-items:center"><i style="display:block;width:120px;height:72px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-2)"></i><span class="mono">shadow-2</span></div><div style="display:grid;gap:8px;justify-items:center"><i style="display:block;width:120px;height:72px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-3)"></i><span class="mono">shadow-3</span></div></div></body></html>
