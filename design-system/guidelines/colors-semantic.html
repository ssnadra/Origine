<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger, info with tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r"><div class="sw" style="width:130px"><i style="background:var(--success);height:36px;border:0"></i><i style="background:var(--success-tint);height:20px;border:0"></i><b>Success</b>--success</div><div class="sw" style="width:130px"><i style="background:var(--warning);height:36px;border:0"></i><i style="background:var(--warning-tint);height:20px;border:0"></i><b>Warning</b>--warning</div><div class="sw" style="width:130px"><i style="background:var(--danger);height:36px;border:0"></i><i style="background:var(--danger-tint);height:20px;border:0"></i><b>Danger</b>--danger</div><div class="sw" style="width:130px"><i style="background:var(--info);height:36px;border:0"></i><i style="background:var(--info-tint);height:20px;border:0"></i><b>Info</b>--info</div></div></body></html>
