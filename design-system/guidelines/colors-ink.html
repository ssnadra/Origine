<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:grid;gap:4px;font-size:12px;color:var(--ink-3);width:84px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--rule)}.sw b{color:var(--ink);font-weight:600}.lab{font:500 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-3)}</style></head><body><div class="r"><div class="sw"><i style="background:var(--ink)"></i><b>Ink</b>--ink</div><div class="sw"><i style="background:var(--ink-hover)"></i><b>Ink hover</b>--ink-hover</div><div class="sw"><i style="background:var(--ink-2)"></i><b>Ink 2</b>--ink-2</div><div class="sw"><i style="background:var(--ink-3)"></i><b>Ink 3</b>--ink-3</div><div class="sw"><i style="background:var(--ink-4)"></i><b>Ink 4</b>--ink-4</div></div></body></html>
